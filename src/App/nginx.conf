server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca deve ser cacheado pelo browser para que sessões expiradas
    # forcem o App Service a redirecionar para o login Entra ID antes do React carregar.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Arquivos estáticos gerados pelo CRA têm hashes nos nomes → cacheable longo prazo.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /.auth/* é interceptado pelo Easy Auth no App Service antes de chegar ao nginx;
    # mas caso alguma requisição chegue, retorna 404 para não vazar informação.
    location /.auth/ {
        return 404;
    }

    # Todas as outras rotas → entrega index.html (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
