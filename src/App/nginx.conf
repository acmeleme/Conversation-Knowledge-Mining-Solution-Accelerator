server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca deve ser cacheado pelo browser para que sessões expiradas
    # forcem o App Service a redirecionar para o login Entra ID antes do React carregar.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Arquivos estáticos gerados pelo CRA têm hashes nos nomes → cacheable longo prazo.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /.auth/me: Easy Auth encaminha esta rota ao nginx em containers customizados.
    # Constrói resposta no formato v1 (array) usando os headers X-MS-CLIENT-PRINCIPAL-*
    # injetados pelo Easy Auth sidecar em cada request autenticado.
    location = /.auth/me {
        default_type application/json;
        return 200 '[{"provider_name":"aad","user_id":"$http_x_ms_client_principal_id","user_claims":[{"typ":"name","val":"$http_x_ms_client_principal_name"},{"typ":"preferred_username","val":"$http_x_ms_client_principal_id"}]}]';
    }

    # /.auth/refresh: token store desabilitado — retorna sucesso vazio para evitar erros.
    location = /.auth/refresh {
        default_type application/json;
        return 200 '{}';
    }

    # Outras rotas /.auth/* são normalmente interceptadas pelo Easy Auth antes do nginx.
    location /.auth/ {
        return 404;
    }

    # Todas as outras rotas → entrega index.html (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
