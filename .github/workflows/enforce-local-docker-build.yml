name: Enforce Local Docker Build Policy

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - demo

jobs:
  block-remote-acr-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Block az acr build usage in executable automation
        shell: bash
        run: |
          set -euo pipefail
          if rg -n --no-heading --glob '*.ps1' --glob '*.sh' --glob '*.yml' --glob '*.yaml' '^[[:space:]]*az[[:space:]]+acr[[:space:]]+build\b' .; then
            echo "❌ Policy violation: remote image build via 'az acr build' is forbidden. Use local Docker build/push."
            exit 1
          fi
          echo "✅ Policy check passed: no forbidden remote ACR build commands found."
