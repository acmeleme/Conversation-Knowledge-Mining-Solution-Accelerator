name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18.x'

jobs:
  # Lint and test Python API
  test-api:
    name: Test Python API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/api
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check formatting with black
      run: black --check --diff .
      continue-on-error: true
    
    - name: Run tests with pytest
      run: |
        pytest ../tests/ --cov=. --cov-report=xml --cov-report=html -v
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./src/api/coverage.xml
        flags: api
        name: api-coverage
      continue-on-error: true

  # Build and test React frontend
  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/App
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./src/App/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint with ESLint
      run: npm run lint || true
      continue-on-error: true
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false || true
      continue-on-error: true
    
    - name: Build application
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ./src/App/build
        retention-days: 7

  # Validate Bicep templates
  validate-infrastructure:
    name: Validate Azure Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Bicep CLI
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
        bicep --version
    
    - name: Validate Bicep files
      run: |
        cd infra
        bicep build main.bicep
        echo "✅ Bicep validation successful"
    
    - name: Bicep Linter
      run: |
        cd infra
        bicep lint main.bicep || true
      continue-on-error: true

  # Docker build validation
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: 
          - { path: './src/api/ApiApp.Dockerfile', context: './src/api', name: 'api' }
          - { path: './src/App/WebApp.Dockerfile', context: './src/App', name: 'webapp' }
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build ${{ matrix.dockerfile.name }} Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.dockerfile.context }}
        file: ${{ matrix.dockerfile.path }}
        push: false
        tags: ckm-${{ matrix.dockerfile.name }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Security scanning with Trivy
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner in repo mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  # Overall build status
  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, validate-infrastructure, docker-build]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.test-api.result }}" == "success" ] && \
           [ "${{ needs.test-frontend.result }}" == "success" ] && \
           [ "${{ needs.validate-infrastructure.result }}" == "success" ] && \
           [ "${{ needs.docker-build.result }}" == "success" ]; then
          echo "✅ All builds passed successfully!"
          exit 0
        else
          echo "❌ Some builds failed"
          echo "API: ${{ needs.test-api.result }}"
          echo "Frontend: ${{ needs.test-frontend.result }}"
          echo "Infrastructure: ${{ needs.validate-infrastructure.result }}"
          echo "Docker: ${{ needs.docker-build.result }}"
          exit 1
        fi
