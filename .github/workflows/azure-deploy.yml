name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      deployment_mode:
        description: 'Deployment mode'
        required: true
        default: 'application-only'
        type: choice
        options:
          - application-only
          - full
      resource_group:
        description: 'Azure Resource Group'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID'
        required: false
        type: string
      tenant_id:
        description: 'Azure Tenant ID'
        required: false
        type: string
      client_id:
        description: 'Azure Client ID'
        required: false
        type: string
      app_name:
        description: 'Frontend App Service name'
        required: false
        type: string
      api_name:
        description: 'API App Service name'
        required: false
        type: string
      acr_login_server:
        description: 'ACR login server'
        required: false
        type: string
      app_repo:
        description: 'Frontend image repository'
        required: false
        type: string
      api_repo:
        description: 'API image repository'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/**'
      - '.github/workflows/azure-deploy.yml'

env:
  AZURE_SUBSCRIPTION_ID: ${{ github.event.inputs.subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ github.event.inputs.tenant_id || secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ github.event.inputs.client_id || secrets.AZURE_CLIENT_ID }}
  RESOURCE_GROUP: ${{ github.event.inputs.resource_group || 'rg-callcenter-100' }}
  APP_NAME: ${{ github.event.inputs.app_name || '' }}
  API_NAME: ${{ github.event.inputs.api_name || '' }}
  ACR_LOGIN_SERVER: ${{ github.event.inputs.acr_login_server || '' }}
  APP_REPO: ${{ github.event.inputs.app_repo || '' }}
  API_REPO: ${{ github.event.inputs.api_repo || '' }}
  LOCATION: 'eastus2'
  DEPLOYMENT_MODE: ${{ github.event.inputs.deployment_mode || 'application-only' }}

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Bicep CLI
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
    
    - name: Validate Bicep templates
      run: |
        cd infra
        bicep build main.bicep
        echo "✅ Bicep validation passed"

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ github.event.inputs.client_id || secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ github.event.inputs.tenant_id || secrets.AZURE_TENANT_ID }}
        allow-no-subscriptions: true
    
    - name: Deploy Infrastructure and Application
      run: |
        if [ "${{ env.DEPLOYMENT_MODE }}" = "full" ]; then
          echo "Running full deployment (Bicep provision + container build/push)"
          az deployment group create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --no-prompt true 2>&1 | tail -20
          echo "✅ Infrastructure provisioned"
        fi
        echo "Deploying application containers..."
        chmod +x infra/scripts/deploy-app-only.sh
        bash infra/scripts/deploy-app-only.sh "${{ env.RESOURCE_GROUP }}"
      env:
        AZURE_SUBSCRIPTION_ID: ${{ github.event.inputs.subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_TENANT_ID: ${{ github.event.inputs.tenant_id || secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ github.event.inputs.client_id || secrets.AZURE_CLIENT_ID }}

    # NOTE: deploy-app-only.sh calls Microsoft Graph to set enableIdTokenIssuance=true on the App
    # Registration. If this step fails, the CI principal ($AZURE_CLIENT_ID) requires the
    # 'Application.ReadWrite.OwnedBy' API permission on Microsoft Graph (admin consent required).
    # Without it, every login will return AADSTS700054 ("response_type id_token is not enabled").
    # Fallback: run infra/scripts/configure-easy-auth.ps1 manually after deployment.
    - name: Validate Easy Auth ID Token Issuance
      run: |
        APP_NAME="${APP_NAME:-$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?starts_with(name,'app-')].name|[0]" -o tsv)}"
        SUB_ID="${AZURE_SUBSCRIPTION_ID:-$(az account show --query id -o tsv)}"
        AUTH_V2_URL="https://management.azure.com/subscriptions/${SUB_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${APP_NAME}/config/authsettingsV2?api-version=2022-03-01"
        CLIENT_ID="$(az rest --method GET --url "$AUTH_V2_URL" --output json | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        try:
            print(data['properties']['identityProviders']['azureActiveDirectory']['registration']['clientId'] or '')
        except (KeyError, TypeError):
            print('')
        ")"
        if [ -z "$CLIENT_ID" ] || [ "$CLIENT_ID" = "None" ]; then
          echo "⚠️  WARNING: Easy Auth client ID not found — configure-easy-auth.ps1 may not have been run."
          echo "   Users will see AADSTS700054. Run configure-easy-auth.ps1 to fix."
          exit 0
        fi
        ID_TOKEN_ENABLED="$(az ad app show --id "$CLIENT_ID" --output json | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        try:
            print(data['web']['implicitGrantSettings']['enableIdTokenIssuance'])
        except (KeyError, TypeError):
            print('False')
        ")"
        if [ "$ID_TOKEN_ENABLED" != "True" ]; then
          echo "❌ FAIL: enableIdTokenIssuance is NOT true on App Registration $CLIENT_ID."
          echo "   Every login will return AADSTS700054."
          echo "   Fix: run infra/scripts/configure-easy-auth.ps1 or grant the CI principal"
          echo "   'Application.ReadWrite.OwnedBy' on Microsoft Graph and re-run the workflow."
          exit 1
        fi
        echo "✅ enableIdTokenIssuance=true confirmed on App Registration $CLIENT_ID."
      env:
        AZURE_SUBSCRIPTION_ID: ${{ github.event.inputs.subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
        APP_NAME: ${{ env.APP_NAME }}

  post-deployment-setup:
    name: Post-Deployment Data Setup
    runs-on: ubuntu-latest
    needs: deploy-application
    if: ${{ github.event.inputs.deployment_mode == 'full' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ github.event.inputs.client_id || secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ github.event.inputs.tenant_id || secrets.AZURE_TENANT_ID }}
        allow-no-subscriptions: true
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        pip install -r infra/scripts/index_scripts/requirements.txt
    
    - name: Install ODBC Driver for SQL Server
      run: |
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
        curl -sSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
        sudo apt-get update -qq
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 -qq
        echo "✅ ODBC Driver 18 installed"
    
    - name: Run post-deployment setup
      run: |
        chmod +x infra/scripts/post-deployment-setup.sh
        bash infra/scripts/post-deployment-setup.sh ${{ env.RESOURCE_GROUP }}
      env:
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
    
    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        WEB_APP_NAME="app-callcenter100"
        API_APP_NAME="api-callcenter100"
        
        echo "✅ UI URL: https://$WEB_APP_NAME.azurewebsites.net"
        echo "✅ API URL: https://$API_APP_NAME.azurewebsites.net"
        
        # Health check with retries (app may be restarting after container update)
        for i in 1 2 3; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://$API_APP_NAME.azurewebsites.net/health" || echo "000")
          echo "  Attempt $i: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ API health check passed"
            break
          fi
          if [ $i -lt 3 ]; then
            echo "  Waiting 20s before retry..."
            sleep 20
          fi
        done
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "❌ API health check failed with status: $HTTP_STATUS"
          exit 1
        fi

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-application, post-deployment-setup]
    if: always()
    
    steps:
    - name: Deployment Summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Resource Group**: ${{ env.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Mode**: ${{ env.DEPLOYMENT_MODE }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.post-deployment-setup.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Results:" >> $GITHUB_STEP_SUMMARY
        echo "- Application deployment: ${{ needs.deploy-application.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Post-Setup: ${{ needs.post-deployment-setup.result }}" >> $GITHUB_STEP_SUMMARY
