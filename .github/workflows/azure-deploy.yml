name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      deployment_mode:
        description: 'Deployment mode'
        required: true
        default: 'application-only'
        type: choice
        options:
          - application-only
          - full
      resource_group:
        description: 'Azure Resource Group'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/**'
      - '.github/workflows/azure-deploy.yml'

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ github.event.inputs.resource_group || 'rg-callcenter-100' }}
  LOCATION: 'eastus2'
  DEPLOYMENT_MODE: ${{ github.event.inputs.deployment_mode || 'application-only' }}

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Bicep CLI
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
    
    - name: Validate Bicep templates
      run: |
        cd infra
        bicep build main.bicep
        echo "✅ Bicep validation passed"

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Install Azure Developer CLI
      if: ${{ github.event.inputs.deployment_mode == 'full' }}
      uses: Azure/setup-azd@v1.0.0
    
    - name: Deploy with azd (application-only or full)
      run: |
        if [ "${{ env.DEPLOYMENT_MODE }}" = "full" ]; then
          echo "Running full deployment (provision + deploy)"
          azd auth login --client-id ${{ secrets.AZURE_CLIENT_ID }} \
            --federated-credential-provider "github" \
            --tenant-id ${{ secrets.AZURE_TENANT_ID }}

          azd env new ${{ github.event.inputs.environment || 'dev' }} || true
          azd env select ${{ github.event.inputs.environment || 'dev' }}

          # Set environment variables
          azd env set AZURE_LOCATION ${{ env.LOCATION }}
          azd env set AZURE_RESOURCE_GROUP ${{ env.RESOURCE_GROUP }}

          azd up --no-prompt
        else
          echo "Running application-only deployment (build/push and update existing App Services)"
          chmod +x infra/scripts/deploy-app-only.sh
          bash infra/scripts/deploy-app-only.sh "${{ env.RESOURCE_GROUP }}"
        fi
      env:
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}

  post-deployment-setup:
    name: Post-Deployment Data Setup
    runs-on: ubuntu-latest
    needs: deploy-application
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        pip install -r infra/scripts/index_scripts/requirements.txt
    
    - name: Run post-deployment setup
      run: |
        chmod +x infra/scripts/post-deployment-setup.sh
        bash infra/scripts/post-deployment-setup.sh ${{ env.RESOURCE_GROUP }}
      env:
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
    
    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        WEB_APP_NAME=$(az webapp list --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "[?contains(name, 'app-')].name" -o tsv | grep -v api)
        API_APP_NAME=$(az webapp list --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "[?contains(name, 'api-')].name" -o tsv)
        
        echo "✅ UI URL: https://$WEB_APP_NAME.azurewebsites.net"
        echo "✅ API URL: https://$API_APP_NAME.azurewebsites.net"
        
        # Health check
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_APP_NAME.azurewebsites.net/health")
        if [ "$HTTP_STATUS" = "200" ]; then
          echo "✅ API health check passed"
        else
          echo "❌ API health check failed with status: $HTTP_STATUS"
          exit 1
        fi

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-application, post-deployment-setup]
    if: always()
    
    steps:
    - name: Deployment Summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Resource Group**: ${{ env.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Mode**: ${{ env.DEPLOYMENT_MODE }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.post-deployment-setup.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Results:" >> $GITHUB_STEP_SUMMARY
        echo "- Application deployment: ${{ needs.deploy-application.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Post-Setup: ${{ needs.post-deployment-setup.result }}" >> $GITHUB_STEP_SUMMARY
