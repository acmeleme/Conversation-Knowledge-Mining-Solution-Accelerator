name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      deployment_mode:
        description: 'Deployment mode'
        required: true
        default: 'application-only'
        type: choice
        options:
          - application-only
          - full
      resource_group:
        description: 'Azure Resource Group'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID'
        required: false
        type: string
      app_name:
        description: 'Frontend App Service name'
        required: false
        type: string
      api_name:
        description: 'API App Service name'
        required: false
        type: string
      acr_login_server:
        description: 'ACR login server'
        required: false
        type: string
      app_repo:
        description: 'Frontend image repository'
        required: false
        type: string
      api_repo:
        description: 'API image repository'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/**'
      - '.github/workflows/azure-deploy.yml'

env:
  AZURE_SUBSCRIPTION_ID: ${{ github.event.inputs.subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ github.event.inputs.resource_group || 'rg-callcenter-100' }}
  APP_NAME: ${{ github.event.inputs.app_name || '' }}
  API_NAME: ${{ github.event.inputs.api_name || '' }}
  ACR_LOGIN_SERVER: ${{ github.event.inputs.acr_login_server || '' }}
  APP_REPO: ${{ github.event.inputs.app_repo || '' }}
  API_REPO: ${{ github.event.inputs.api_repo || '' }}
  LOCATION: 'eastus2'
  DEPLOYMENT_MODE: ${{ github.event.inputs.deployment_mode || 'application-only' }}

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Bicep CLI
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
    
    - name: Validate Bicep templates
      run: |
        cd infra
        bicep build main.bicep
        echo "✅ Bicep validation passed"

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ github.event.inputs.subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy Infrastructure and Application
      run: |
        if [ "${{ env.DEPLOYMENT_MODE }}" = "full" ]; then
          echo "Running full deployment (Bicep provision + container build/push)"
          az deployment group create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --no-prompt true 2>&1 | tail -20
          echo "✅ Infrastructure provisioned"
        fi
        echo "Deploying application containers..."
        chmod +x infra/scripts/deploy-app-only.sh
        bash infra/scripts/deploy-app-only.sh "${{ env.RESOURCE_GROUP }}"
      env:
        AZURE_SUBSCRIPTION_ID: ${{ github.event.inputs.subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}

  post-deployment-setup:
    name: Post-Deployment Data Setup
    runs-on: ubuntu-latest
    needs: deploy-application
    if: ${{ github.event.inputs.deployment_mode == 'full' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ github.event.inputs.subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        pip install -r infra/scripts/index_scripts/requirements.txt
    
    - name: Install ODBC Driver for SQL Server
      run: |
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
        curl -sSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
        sudo apt-get update -qq
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 -qq
        echo "✅ ODBC Driver 18 installed"
    
    - name: Run post-deployment setup
      run: |
        chmod +x infra/scripts/post-deployment-setup.sh
        bash infra/scripts/post-deployment-setup.sh ${{ env.RESOURCE_GROUP }}
      env:
        RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
    
    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        WEB_APP_NAME="app-callcenter100"
        API_APP_NAME="api-callcenter100"
        
        echo "✅ UI URL: https://$WEB_APP_NAME.azurewebsites.net"
        echo "✅ API URL: https://$API_APP_NAME.azurewebsites.net"
        
        # Health check with retries (app may be restarting after container update)
        for i in 1 2 3; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://$API_APP_NAME.azurewebsites.net/health" || echo "000")
          echo "  Attempt $i: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ API health check passed"
            break
          fi
          if [ $i -lt 3 ]; then
            echo "  Waiting 20s before retry..."
            sleep 20
          fi
        done
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "❌ API health check failed with status: $HTTP_STATUS"
          exit 1
        fi

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-application, post-deployment-setup]
    if: always()
    
    steps:
    - name: Deployment Summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Resource Group**: ${{ env.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Mode**: ${{ env.DEPLOYMENT_MODE }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.post-deployment-setup.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Results:" >> $GITHUB_STEP_SUMMARY
        echo "- Application deployment: ${{ needs.deploy-application.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Post-Setup: ${{ needs.post-deployment-setup.result }}" >> $GITHUB_STEP_SUMMARY
